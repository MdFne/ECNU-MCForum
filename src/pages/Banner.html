<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
        }

        .hero-banner {
            position: relative;
            width: 100%;
            height: 80vh;
            background: #242424;
            overflow: hidden;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            inset: 5%;
        }

        .layer-title h1 {
            font-size: 4rem;
            color: #fff;
            text-align: center;
            line-height: 70vh;
        }

        .planet-bg {
            width: 200px;
            height: 200px;
            background-color: #bc4b4b;
            border-radius: 50%;
            position: absolute;
            top: 20%;
            left: 70%;
            transform: translate(-50%, -50%);
        }

        .planet-fg {
            width: 150px;
            height: 150px;
            background-color: #bc4b4b;
            border-radius: 50%;
            position: absolute;
            top: 60%;
            left: 20%;
            transform: translate(-50%, -50%);
        }

        .asteroid {
            width: 100px;
            height: 100px;
            background-color: #bc4b4b;
            border-radius: 50%;
            position: absolute;
            top: 80%;
            left: 30%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <div class="hero-banner" id="hero-banner">

        <div class="layer layer-planet-bg">
            <div class="planet-bg"></div>
        </div>

        <div class="layer layer-title">
            <h1>UNIVERSE</h1>
        </div>

        <div class="layer layer-planet-fg">
            <div class="planet-fg"></div>
        </div>

        <div class="layer layer-asteroid">
            <div class="asteroid"></div>
        </div>
    </div>

    <script>
        const heroBanner = document.getElementById('hero-banner');
        const layers = [
            {
                elem: document.querySelector('.layer-title'),
                offsetX: 24,
                offsetY: 8,
            },
            {
                elem: document.querySelector('.layer-planet-bg'),
                offsetX: 48,
                offsetY: 16,
            },
            {
                elem: document.querySelector('.layer-planet-fg'),
                offsetX: 6,
                offsetY: 6,
            },
            {
                elem: document.querySelector('.layer-asteroid'),
                offsetX: -2,
                offsetY: -2,
            }
        ]

        let targetX = 0;
        let targetY = 0;

        heroBanner.addEventListener('pointermove', (e) => {
            const rect = heroBanner.getBoundingClientRect();
            const localX = e.clientX - rect.left;
            const localY = e.clientY - rect.top;

            const centerX = localX - rect.width / 2;
            const centerY = localY - rect.height / 2;

            targetX = centerX / rect.width / 2;
            targetY = centerY / rect.height / 2;
            startRender();
        })

        let scheduledRender = false;
        function startRender() {
            if (scheduledRender) {
                return;
            }
            requestAnimationFrame(render);
            scheduledRender = true;
        }

        let currentX = 0;
        let currentY = 0;
        const lerpFactor = 0.1;
        const threshold = 0.001;
        function render() {
            currentX += (targetX - currentX) * lerpFactor;
            currentY += (targetY - currentY) * lerpFactor;

            if (Math.abs(currentX - targetX) < threshold && Math.abs(currentY - targetY) < threshold) {
                currentX = targetX;
                currentY = targetY;
                scheduledRender = false;
            }

            for (const layer of layers) {

                const moveX = currentX * layer.offsetX * 10;
                const moveY = currentY * layer.offsetY * 10;
                layer.elem.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }

            if (scheduledRender) {
                requestAnimationFrame(render); // 递归调用，实现动画效果
            }
        }

        heroBanner.addEventListener('pointerleave', () => {
            targetX = 0;
            targetY = 0;
            startRender();
        })
    </script>
</body>

</html>
